name: CI

# Verifie que le build passe sur chaque PR (remplace le preview build Cloudflare).
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Auth GitHub Packages (Wara DS)
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.WARA_DS_TOKEN }}" >> ~/.npmrc

      - run: npm ci

      - run: npm test

      - run: npm run build

  lfs-pointers:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The whole PR range, not HEAD: a blob replaced by a pointer later in the PR stays in history.
      - name: Check LFS-tracked files are pointers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git lfs version
          git lfs fsck --pointers "$BASE_SHA..$HEAD_SHA"
